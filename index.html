/* =========================================================================
   SUPABASE STORAGE — get/set/delete/list, backed by table `pbi_data`
   Reads the client created from SUPABASE_URL / SUPABASE_ANON_KEY below.
========================================================================= */

async function storageGet(key) {
  try {
    const { data, error } = await sb.from('pbi_data').select('value').eq('key', key).maybeSingle();
    if (error || !data) return null;
    return data.value;
  } catch (e) { console.error('storageGet failed', key, e); return null; }
}
async function storageSet(key, value) {
  try {
    const payload = typeof value === 'string' ? value : JSON.stringify(value);
    const { error } = await sb.from('pbi_data').upsert({ key, value: payload, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    if (error) { console.error('storageSet failed', key, error); return false; }
    return true;
  } catch (e) { console.error('storageSet failed', key, e); return false; }
}
async function storageDelete(key) {
  try {
    const { error } = await sb.from('pbi_data').delete().eq('key', key);
    return !error;
  } catch (e) { console.error('storageDelete failed', key, e); return false; }
}
async function storageList(prefix) {
  try {
    const { data, error } = await sb.from('pbi_data').select('key').like('key', `${prefix}%`);
    if (error || !data) return [];
    return data.map((r) => r.key);
  } catch (e) { console.error('storageList failed', prefix, e); return []; }
}

const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 10);
const pad2 = (n) => String(n).padStart(2, '0');

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function addDaysStr(dateStr, delta) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d + delta);
  return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;
}
function dateToDow(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).getDay();
}
function isWeekendDate(dateStr) {
  const dow = dateToDow(dateStr);
  return dow === 0 || dow === 6;
}
function monthKeyOf(dateStr) { return dateStr.slice(0, 7); }
function startOfWeekMonday(dateStr) {
  const dow = dateToDow(dateStr); // 0=Sun..6=Sat
  const diff = dow === 0 ? -6 : 1 - dow;
  return addDaysStr(dateStr, diff);
}
function weekDates(mondayStr) {
  return Array.from({ length: 7 }, (_, i) => addDaysStr(mondayStr, i));
}
function fmtShortDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d} ${months[m - 1]}`;
}
const MONTH_NAMES_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthLabel(yyyyMm) {
  const [y, m] = yyyyMm.split('-').map(Number);
  return `${MONTH_NAMES_FULL[m - 1]} ${y}`;
}
function monthOptions(pastCount = 8, futureCount = 11) {
  const today = todayStr();
  const [y0, m0] = today.split('-').map(Number);
  const opts = [];
  for (let offset = -pastCount; offset <= futureCount; offset++) {
    const total = (m0 - 1) + offset;
    const y = y0 + Math.floor(total / 12);
    const m = ((total % 12) + 12) % 12 + 1;
    const value = `${y}-${pad2(m)}`;
    opts.push({ value, label: monthLabel(value) });
  }
  return opts;
}
function timeAgo(isoString) {
  if (!isoString) return '—';
  const then = new Date(isoString).getTime();
  const now = Date.now();
  const diffMs = now - then;
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min${mins === 1 ? '' : 's'} ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} hr${hrs === 1 ? '' : 's'} ago`;
  const days = Math.round(hrs / 24);
  return `${days} day${days === 1 ? '' : 's'} ago`;
}
function daysInMonth(yyyyMm) {
  const [y, m] = yyyyMm.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function weekRangesForMonth(yyyyMm) {
  const total = daysInMonth(yyyyMm);
  const ranges = [];
  for (let start = 1; start <= total; start += 7) {
    const end = Math.min(start + 6, total);
    ranges.push({ label: `Week ${ranges.length + 1}`, startDay: start, endDay: end });
  }
  return ranges;
}
function complementRanges(startTime, endTime) {
  // given an off-peak window, return the rest-of-day range(s) so a
  // generated "peak" rule never overlaps it
  const startMin = timeToMin(startTime);
  const endMin = timeToMin(endTime);
  const ranges = [];
  if (startMin > 0) ranges.push({ start: '00:00', end: startTime });
  if (endMin < 23 * 60 + 59) ranges.push({ start: endTime, end: '23:59' });
  return ranges;
}
function timeToMin(t) { if (!t) return 0; const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function hourLabel(h) {
  const period = h < 12 ? 'AM' : 'PM';
  let hh = h % 12; if (hh === 0) hh = 12;
  return `${hh}${period}`;
}
function fmtMoney(n) {
  if (n == null || isNaN(n)) return 'Rs 0';
  return 'Rs ' + Math.round(n).toLocaleString('en-US');
}
function fmtPct(n) {
  if (n == null || isNaN(n)) return '—';
  return n.toFixed(1) + '%';
}
function safeDiv(a, b) { return b > 0 ? a / b : 0; }

function defaultHourStates(openTime, closeTime) {
  // Pre-fill hours within the venue/court's opening hours as "available"
  // and everything outside as "closed" — so you only need to touch the
  // hours that were actually booked. Handles a midnight close time
  // ("00:00") correctly as end-of-day rather than hour 0.
  const openMin = timeToMin(openTime || '06:00');
  let closeMin = timeToMin(closeTime || '22:00');
  if (closeMin <= openMin) closeMin += 24 * 60;
  const arr = [];
  for (let h = 0; h < 24; h++) {
    const withinOpen = h * 60 >= openMin && h * 60 < closeMin;
    arr.push({ state: withinOpen ? 'available' : 'closed', price: null, category: null });
  }
  return arr;
}

function courtHours(court, venue) {
  return {
    open: court.openOverride || venue?.openingTime || '06:00',
    close: court.closeOverride || venue?.closingTime || '22:00',
  };
}

function matchPricingRule(rules, courtId, dateStr, hour) {
  const dow = dateToDow(dateStr);
  const weekend = dow === 0 || dow === 6;
  const candidates = rules.filter(r => {
    if (r.courtId !== courtId) return false;
    if (r.effectiveFrom && dateStr < r.effectiveFrom) return false;
    if (r.effectiveUntil && dateStr > r.effectiveUntil) return false;
    if (r.dayType === 'weekday' && weekend) return false;
    if (r.dayType === 'weekend' && !weekend) return false;
    const startMin = timeToMin(r.startTime), endMin = timeToMin(r.endTime);
    const hMin = hour * 60;
    return hMin >= startMin && hMin < endMin;
  });
  if (candidates.length === 0) return null;
  // prefer most specific (non-'all' dayType), then most recent effectiveFrom
  candidates.sort((a, b) => {
    const aSpecific = a.dayType !== 'all' ? 1 : 0;
    const bSpecific = b.dayType !== 'all' ? 1 : 0;
    if (aSpecific !== bSpecific) return bSpecific - aSpecific;
    return (b.effectiveFrom || '').localeCompare(a.effectiveFrom || '');
  });
  return candidates[0];
}

function periodOfHour(h) {
  if (h >= 5 && h < 8) return 'Early Morning';
  if (h >= 8 && h < 12) return 'Morning';
  if (h >= 12 && h < 16) return 'Afternoon';
  if (h >= 16 && h < 20) return 'Evening';
  if (h >= 20 && h < 24) return 'Night';
  return 'Late Night';
}

function hotspotFor(pct) {
  for (const lvl of HOTSPOT_LEVELS) if (pct < lvl.max) return lvl;
  return HOTSPOT_LEVELS[HOTSPOT_LEVELS.length - 1];
}

function buildSampleData() {
  const venues = [
    { id: 'v1', name: 'Kitchen Line Colombo', country: 'Sri Lanka', province: 'Western Province', district: 'Colombo', city: 'Colombo 5', address: 'Havelock Rd', lat: 6.8845, lng: 79.8657, courtCount: 3, type: 'covered_outdoor', openingTime: '06:00', closingTime: '23:00', active: true, notes: '' },

    { id: 'v3', name: 'Nugegoda Paddle Club', country: 'Sri Lanka', province: 'Western Province', district: 'Colombo', city: 'Nugegoda', address: 'High Level Rd', lat: 6.8721, lng: 79.8890, courtCount: 2, type: 'indoor', openingTime: '07:00', closingTime: '23:00', active: true, notes: '' },
  ];
  const courts = [];
  venues.forEach(v => {
    for (let i = 1; i <= v.courtCount; i++) {
      courts.push({ id: uid('c'), venueId: v.id, name: `Court ${i}`, number: i, type: 'standard', surface: 'acrylic', active: true, openOverride: '', closeOverride: '', notes: '' });
    }
  });
  const pricing = [];
  venues.forEach(v => {
    const vCourts = courts.filter(c => c.venueId === v.id);
    const rows = [
      { dayType: 'weekday', startTime: '06:00', endTime: '16:00', price: 2500, category: 'off_peak', label: 'Weekday off-peak' },
      { dayType: 'weekday', startTime: '16:00', endTime: '23:59', price: 3500, category: 'peak', label: 'Weekday evening peak' },
      { dayType: 'weekend', startTime: '06:00', endTime: '23:59', price: 3500, category: 'peak', label: 'Weekend peak' },
    ];
    rows.forEach(row => {
      const groupId = uid('rg');
      vCourts.forEach(c => {
        pricing.push({ id: uid('pr'), courtId: c.id, ruleGroupId: groupId, effectiveFrom: '2026-01-01', effectiveUntil: '', ...row });
      });
    });
  });

  const specialDays = {};
  // mark today as nothing special; leave calendar empty for the user to fill in.

  // occupancy: last 14 days, plausible pattern - evenings & weekends busier
  const occByMonth = {};
  const today = todayStr();
  for (let d = 13; d >= 0; d--) {
    const dateStr = addDaysStr(today, -d);
    const mKey = monthKeyOf(dateStr);
    if (!occByMonth[mKey]) occByMonth[mKey] = {};
    const weekend = isWeekendDate(dateStr);
    courts.forEach(c => {
      const venue = venues.find(v => v.id === c.venueId);
      const { open, close } = courtHours(c, venue);
      const hours = defaultHourStates(open, close);
      for (let h = 0; h < 24; h++) {
        if (hours[h].state === 'closed') continue;
        let baseProb = 0.25;
        if (h >= 17 && h <= 21) baseProb = weekend ? 0.85 : 0.7;
        else if (h >= 12 && h <= 16) baseProb = weekend ? 0.55 : 0.3;
        else if (h >= 6 && h <= 9) baseProb = weekend ? 0.5 : 0.35;
        const occupied = Math.random() < baseProb;
        const rule = matchPricingRule(pricing, c.id, dateStr, h);
        hours[h] = {
          state: occupied ? 'occupied' : 'available',
          price: rule ? rule.price : null,
          category: rule ? rule.category : null,
        };
      }
      if (!occByMonth[mKey][c.id]) occByMonth[mKey][c.id] = {};
      occByMonth[mKey][c.id][dateStr] = hours;
    });
  }

  return { master: { venues, courts, pricing, specialDays }, occByMonth };
}

    if (m) {
      try {
        const parsed = JSON.parse(m);
        setMaster({ ...emptyMaster(), ...parsed });
      } catch (e) { setMaster(emptyMaster()); }
    }
    const keys = await storageList('pbi_occ_', true);
    const occ = {};
    for (const k of keys) {
      const v = await storageGet(k, true);
      if (v) {
        try {
          const monthKey = k.replace('pbi_occ_', '');
          occ[monthKey] = JSON.parse(v);
          loadedMonths.current.add(monthKey);
        } catch (e) { /* skip */ }
      }
    }
    setOccData(occ);
    setLoading(false);
  }

  async function persistMaster(next) {
    setMaster(next);
    setSaving(true);
    await storageSet(MASTER_KEY, next, true);
    setSaving(false);
  }

  async function persistOccMonth(monthKey, monthData) {
    setOccData(prev => ({ ...prev, [monthKey]: monthData }));
    setSaving(true);
    await storageSet('pbi_occ_' + monthKey, monthData, true);
    setSaving(false);
  }

  async function loadSample() {
    setSaving(true);
    const { master: m, occByMonth } = buildSampleData();
    await storageSet(MASTER_KEY, m, true);
    for (const mk of Object.keys(occByMonth)) {
      await storageSet('pbi_occ_' + mk, occByMonth[mk], true);
    }
    setMaster(m);
    setOccData(occByMonth);
    setSaving(false);
  }

  async function clearAll() {
    setSaving(true);
    await storageSet(MASTER_KEY, emptyMaster(), true);
    for (const mk of Object.keys(occData)) {
      try { await storageDelete('pbi_occ_' + mk); } catch (e) {}
    }
    setMaster(emptyMaster());
    setOccData({});
    setSaving(false);
  }

  async function clearBookingsOnly() {
    setSaving(true);
    for (const mk of Object.keys(occData)) {
      try { await storageDelete('pbi_occ_' + mk); } catch (e) {}
    }
    setOccData({});
    setSaving(false);
  }

  // ---- flatten occupancy into analytics-friendly rows ----
  const flatRows = useMemo(() => {
    const rows = [];
    const courtById = {}; master.courts.forEach(c => courtById[c.id] = c);
    const venueById = {}; master.venues.forEach(v => venueById[v.id] = v);
    Object.entries(occData).forEach(([monthKey, byCourt]) => {
      Object.entries(byCourt).forEach(([courtId, byDate]) => {
        const court = courtById[courtId];
        if (!court) return;
        const venue = venueById[court.venueId];
        if (!venue) return;
        Object.entries(byDate).forEach(([dateStr, hours]) => {
          const weekend = isWeekendDate(dateStr);
          const special = master.specialDays[dateStr];
          hours.forEach((h, hour) => {
            if (h.state === 'closed') return;
            rows.push({
              courtId, courtName: court.name, venueId: venue.id, venueName: venue.name,
              business: venue.business || venue.name,
              city: venue.city, district: venue.district, province: venue.province,
              date: dateStr, hour, weekend, special: special ? special.type : null,
              state: h.state, occupied: h.state === 'occupied',
              price: h.price, category: h.category,
            });
          });
        });
      });
    });
    return rows;
  }, [occData, master]);

  function aggregate(rows) {
    const eventHours = rows.filter(r => r.state === 'event').length;
    const countable = rows.filter(r => r.state !== 'event');
    const occupiedHours = countable.filter(r => r.occupied).length;
    const revenue = countable.filter(r => r.occupied).reduce((s, r) => s + (r.price || 0), 0);

    // Occupancy = total hours booked at a venue on a day ÷ (that venue's
    // full court count × 24 hours). If a venue has 6 courts but only 1 was
    // logged that day, the other 5 still count in the denominator — an
    // unlogged/unbooked court is 0% occupied that day, not excluded.
    const courtCountByVenue = {};
    master.venues.forEach(v => { courtCountByVenue[v.id] = master.courts.filter(c => c.venueId === v.id).length || 1; });
    const venueDayPairs = new Set();
    const courtDayPairs = new Set();
    rows.forEach(r => { venueDayPairs.add(r.venueId + '|' + r.date); courtDayPairs.add(r.courtId + '|' + r.date); });
    let availableHours = 0;
    venueDayPairs.forEach(pair => {
      const venueId = pair.split('|')[0];
      availableHours += (courtCountByVenue[venueId] || 1) * 24;
    });

    const occupancyPct = safeDiv(occupiedHours, availableHours) * 100;
    const revpah = safeDiv(revenue, availableHours);
    const avgRate = safeDiv(revenue, occupiedHours);
    return { availableHours, occupiedHours, revenue, occupancyPct, revpah, avgRate, eventHours, courtDays: courtDayPairs.size, venueDays: venueDayPairs.size };
  }

  const ctx = {
    master, setMaster: persistMaster, occData, setOccData, persistOccMonth,
    flatRows, aggregate, saving, loadSample, clearAll, clearBookingsOnly,
    isAdmin,
  };

  if (loading) {
    return (
      <div style={styles.loadingWrap}>
        <style>{GLOBAL_CSS}</style>
        <Loader2 className="spin" size={28} />
        <div style={{ marginTop: 10, fontFamily: 'var(--font-body)', color: 'var(--muted)' }}>Loading court data…</div>
      </div>
    );
  }

  return (
    <div style={styles.app} className="app-shell">
      <style>{GLOBAL_CSS}</style>
      <Sidebar tab={tab} setTab={setTab} venueCount={master.venues.length} saving={saving} isAdmin={isAdmin} adminLogin={adminLogin} adminLogout={adminLogout} />
      <main style={styles.main} className="app-main">
        {tab === 'overview' && <OverviewTab ctx={ctx} />}
        {tab === 'geography' && <GeographyTab ctx={ctx} />}
        {tab === 'venues' && <VenuesTab ctx={ctx} />}
        {tab === 'pricing' && <PricingTab ctx={ctx} />}
        {tab === 'occupancy' && <OccupancyTab ctx={ctx} />}
        {tab === 'heatmap' && <HeatmapTab ctx={ctx} />}
        {tab === 'rankings' && <RankingsTab ctx={ctx} />}
        {tab === 'business' && <BusinessTab ctx={ctx} />}
        {tab === 'insights' && <InsightsTab ctx={ctx} />}
        {tab === 'checklog' && <DataLogTab ctx={ctx} />}
        {tab === 'calendar' && <CalendarTab ctx={ctx} />}
      </main>
    </div>
  );
}

function OverviewTab({ ctx }) {
  const { master, flatRows, aggregate, loadSample, clearAll, clearBookingsOnly, isAdmin } = ctx;
  const today = todayStr();
  const last30 = addDaysStr(today, -30);

  const todayRows = flatRows.filter(r => r.date === today);
  const recentRows = flatRows.filter(r => r.date >= last30 && r.date <= today);
  const weekdayRows = recentRows.filter(r => !r.weekend);
  const weekendRows = recentRows.filter(r => r.weekend);

  const todayAgg = aggregate(todayRows);
  const recentAgg = aggregate(recentRows);
  const weekdayAgg = aggregate(weekdayRows);
  const weekendAgg = aggregate(weekendRows);

  const byHourToday = Array.from({ length: 24 }, (_, h) => {
    const rows = todayRows.filter(r => r.hour === h);
    return { h, ...aggregate(rows) };
  });
  const busiestHour = byHourToday.filter(x => x.availableHours > 0).sort((a, b) => b.occupancyPct - a.occupancyPct)[0];

  const byCityRecent = groupAndAggregate(recentRows, r => r.city, aggregate);
  const busiestCity = byCityRecent.sort((a, b) => b.occupancyPct - a.occupancyPct)[0];

  const byVenueRecent = groupAndAggregate(recentRows, r => r.venueName, aggregate);
  const busiestVenue = byVenueRecent.sort((a, b) => b.occupancyPct - a.occupancyPct)[0];

  if (master.venues.length === 0) {
    return (
      <TabWrap title="Market Overview" eyebrow="Sri Lanka · National">
        <EmptyState icon={Sparkles} title="No data yet"
          body={isAdmin ? "Add your first venue, or load sample data to explore every screen before you start entering real courts." : "No venues have been added yet. Log in as admin (bottom of the sidebar) to set this up."}
          action={
            isAdmin ? (
              <div style={{ display: 'flex', gap: 10, marginTop: 16 }}>
                <button style={styles.primaryBtn} onClick={loadSample}>Load sample data</button>
              </div>
            ) : null
          } />
      </TabWrap>

  return (
    <TabWrap title="Market Overview" eyebrow="Sri Lanka · National"
      right={
        isAdmin ? (
          <div style={{ display: 'flex', gap: 8 }}>

      </div>

      <div style={styles.statGrid} className="stat-grid">
        <StatBlock label="Venues tracked" value={master.venues.length} />
        <StatBlock label="Courts tracked" value={master.courts.length} />
        <StatBlock label="Cities tracked" value={new Set(master.venues.map(v => v.city)).size} />
        <StatBlock label="Today's occupancy" value={fmtPct(todayAgg.occupancyPct)} accent="var(--court)" />
        <StatBlock label="Today's estimated revenue" value={fmtMoney(todayAgg.revenue)} accent="var(--ball-dark)" />
        <StatBlock label="Busiest hour today" value={busiestHour ? hourLabel(busiestHour.h) : '—'} sub={busiestHour ? fmtPct(busiestHour.occupancyPct) + ' occupied' : ''} />
      </div>

      <div style={styles.twoCol} className="two-col">

function groupAndAggregate(rows, keyFn, aggregate) {
  const groups = {};
  rows.forEach(r => {
    const k = keyFn(r);
    if (!k) return;
    if (!groups[k]) groups[k] = [];
    groups[k].push(r);
  });
  return Object.entries(groups).map(([key, rs]) => ({ key, ...aggregate(rs), count: rs.length }));
}

  );

/* =========================================================================
   GEOGRAPHY TAB — hierarchical drill-down
========================================================================= */

function GeographyTab({ ctx }) {
  const { master, flatRows, aggregate } = ctx;
  const [province, setProvince] = useState('');
  const [district, setDistrict] = useState('');
  const [city, setCity] = useState('');
  const [monthKey, setMonthKey] = useState(todayStr().slice(0, 7));
  const [week, setWeek] = useState(''); // '' = whole month

  const districts = province ? PROVINCE_DISTRICTS[province] : [...new Set(master.venues.map(v => v.district))];
  const cities = [...new Set(master.venues.filter(v => (!province || v.province === province) && (!district || v.district === district)).map(v => v.city))];
  const weeks = weekRangesForMonth(monthKey);
  useEffect(() => { setWeek(''); }, [monthKey]);

  let rows = monthKey === 'all' ? flatRows : flatRows.filter(r => monthKeyOf(r.date) === monthKey);
  if (monthKey !== 'all' && week !== '') {
    const w = weeks[Number(week)];
    rows = rows.filter(r => {
      const day = parseInt(r.date.split('-')[2], 10);
      return day >= w.startDay && day <= w.endDay;
    });
  }
  if (province) rows = rows.filter(r => r.province === province);
  if (district) rows = rows.filter(r => r.district === district);
  if (city) rows = rows.filter(r => r.city === city);

  const agg = aggregate(rows);
  const level = city ? 'city' : district ? 'district' : province ? 'province' : 'national';

  const groupKey = level === 'national' ? r => r.province
    : level === 'province' ? r => r.district
    : level === 'district' ? r => r.city
    : r => r.venueName;

  const breakdown = groupAndAggregate(rows, groupKey, aggregate).sort((a, b) => b.occupancyPct - a.occupancyPct);

  const venuesInScope = master.venues.filter(v =>
    (!province || v.province === province) && (!district || v.district === district) && (!city || v.city === city));

  return (
    <TabWrap title="Geographic Drill-Down" eyebrow="Sri Lanka → Province → District → City → Venue → Court">
      <div style={styles.filterRow}>
        <Select value={monthKey} onChange={setMonthKey} options={[{ value: 'all', label: 'All time' }, ...monthOptions()]} />
        {monthKey !== 'all' && <Select value={week} onChange={setWeek} placeholder="Whole month" options={weeks.map((w, i) => ({ value: String(i), label: `${w.label} (${w.startDay}–${w.endDay})` }))} />}
        <Select value={province} onChange={v => { setProvince(v); setDistrict(''); setCity(''); }} placeholder="All provinces" options={PROVINCES} />
        <Select value={district} onChange={v => { setDistrict(v); setCity(''); }} placeholder="All districts" options={districts} />
        <Select value={city} onChange={setCity} placeholder="All cities" options={cities} />
      </div>

      <div style={styles.statGrid} className="stat-grid">
        <StatBlock label="Venues in scope" value={venuesInScope.length} />

        <StatBlock label="Occupied court-hrs" value={agg.occupiedHours.toLocaleString()} />
        <StatBlock label="Occupancy" value={fmtPct(agg.occupancyPct)} accent="var(--court)" />
        <StatBlock label="Est. revenue" value={fmtMoney(agg.revenue)} accent="var(--ball-dark)" />

        <StatBlock label="Event hrs" value={agg.eventHours.toLocaleString()} sub="booked for events, excluded above" />

function VenuesTab({ ctx }) {
  const { master, setMaster, loadSample, isAdmin } = ctx;
  const [editingVenue, setEditingVenue] = useState(null); // null = closed, 'new' = new, obj = editing
  const [expanded, setExpanded] = useState(null);
  const [editingCourt, setEditingCourt] = useState(null); // {venueId, court|'new'}

  function saveVenue(venue) {
    const exists = master.venues.some(v => v.id === venue.id);
    const venues = exists ? master.venues.map(v => v.id === venue.id ? venue : v) : [...master.venues, venue];

    // Auto-create Court 1..N up to the requested court count. Never removes
    // or renames courts that already exist — only tops up the shortfall.
    const currentCourts = master.courts.filter(c => c.venueId === venue.id);
    const wanted = Math.max(0, parseInt(venue.courtCount, 10) || 0);
    let courts = master.courts;
    if (wanted > currentCourts.length) {
      const usedNumbers = new Set(currentCourts.map(c => c.number));
      const newCourts = [];
      let n = 1;
      for (let i = currentCourts.length; i < wanted; i++) {
        while (usedNumbers.has(n)) n++;
        newCourts.push({ id: uid('c'), venueId: venue.id, name: `Court ${n}`, number: n, type: 'standard', surface: 'acrylic', active: true, openOverride: '', closeOverride: '', notes: '' });
        usedNumbers.add(n);
        n++;
      }
      courts = [...master.courts, ...newCourts];
    }
    setMaster({ ...master, venues, courts });
    setEditingVenue(null);
  }
  function deleteVenue(id) {
    if (!confirm('Delete this venue and all its courts? Occupancy history for its courts will be orphaned.')) return;
    const courtIds = master.courts.filter(c => c.venueId === id).map(c => c.id);
    setMaster({
      ...master,
      venues: master.venues.filter(v => v.id !== id),
      courts: master.courts.filter(c => c.venueId !== id),
      pricing: master.pricing.filter(p => !courtIds.includes(p.courtId)),
    });
  }
  function saveCourt(court) {
    const exists = master.courts.some(c => c.id === court.id);
    const courts = exists ? master.courts.map(c => c.id === court.id ? court : c) : [...master.courts, court];
    setMaster({ ...master, courts });
    setEditingCourt(null);
  }
  function deleteCourt(id) {
    if (!confirm('Delete this court? Its pricing rules will also be removed.')) return;
    setMaster({ ...master, courts: master.courts.filter(c => c.id !== id), pricing: master.pricing.filter(p => p.courtId !== id) });
  }

  return (
    <TabWrap title="Venues & Courts" eyebrow="Master data"
      right={isAdmin ? <button style={styles.primaryBtn} onClick={() => setEditingVenue('new')}><Plus size={14} /> Add venue</button> : null}>

      {master.venues.length === 0 && (
        <EmptyState icon={Building2} title="No venues yet"
          body={isAdmin ? "Add your first venue manually, or load realistic sample data (3 venues, 9 courts, pricing & 2 weeks of occupancy) to explore the app." : "No venues have been added yet."}
          action={isAdmin ? <button style={{ ...styles.primaryBtn, marginTop: 14 }} onClick={loadSample}>Load sample data</button> : null} />
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        {master.venues.map(v => {
          const vCourts = master.courts.filter(c => c.venueId === v.id);
          const isOpen = expanded === v.id;
          return (
            <Card key={v.id} style={{ padding: 0, overflow: 'hidden' }}>
              <div style={styles.venueRow} onClick={() => setExpanded(isOpen ? null : v.id)}>
                <ChevronDown size={16} style={{ transform: isOpen ? 'rotate(0deg)' : 'rotate(-90deg)', transition: 'transform .15s', flexShrink: 0 }} />
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    {v.business && <Badge tone="weekday">{v.business}</Badge>}
                    <div style={{ fontWeight: 800, fontFamily: 'var(--font-display)', letterSpacing: '.01em' }}>{v.name}</div>
                  </div>
                  <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 2 }}>
                    {v.city} · {v.district} · {v.province} · {vCourts.length} court{vCourts.length === 1 ? '' : 's'} · {v.type.replace('_', ' ')}
                  </div>
                </div>
                {isAdmin && <button style={styles.iconBtn} onClick={e => { e.stopPropagation(); setEditingVenue(v); }}><Edit2 size={14} /></button>}
                {isAdmin && <button style={styles.iconBtn} onClick={e => { e.stopPropagation(); deleteVenue(v.id); }}><Trash2 size={14} /></button>}
              </div>
              {isOpen && (
                <div style={styles.venueBody}>
                  {vCourts.length === 0 && <div style={styles.mutedNote}>No courts added yet.</div>}
                  {vCourts.map(c => (
                    <div key={c.id} style={styles.courtRow}>
                      <CircleDot size={13} color="var(--court)" />
                      <div style={{ flex: 1 }}>
                        <b>{c.name}</b>
                        <span style={{ color: 'var(--muted)', marginLeft: 8, fontSize: 12 }}>
                          {c.surface} · {c.openOverride || 'venue hours'}–{c.closeOverride || ''}
                        </span>
                      </div>
                      {isAdmin && <button style={styles.iconBtnSm} onClick={() => setEditingCourt({ venueId: v.id, court: c })}><Edit2 size={12} /></button>}
                      {isAdmin && <button style={styles.iconBtnSm} onClick={() => deleteCourt(c.id)}><Trash2 size={12} /></button>}
                    </div>
                  ))}
                  {isAdmin && (
                    <button style={{ ...styles.ghostBtn, marginTop: 8 }} onClick={() => setEditingCourt({ venueId: v.id, court: 'new' })}>
                      <Plus size={13} /> Add court
                    </button>
                  )}
                </div>
              )}
            </Card>
          );
        })}
      </div>

      {editingVenue && <VenueModal venue={editingVenue === 'new' ? null : editingVenue} knownBusinesses={[...new Set(master.venues.map(v => v.business).filter(Boolean))]} onSave={saveVenue} onClose={() => setEditingVenue(null)} />}
      {editingCourt && (
        <CourtModal
          court={editingCourt.court === 'new' ? null : editingCourt.court}
          venueId={editingCourt.venueId}
          existingCount={master.courts.filter(c => c.venueId === editingCourt.venueId).length}
          onSave={saveCourt}
          onClose={() => setEditingCourt(null)}
        />
      )}
    </TabWrap>
  );
}

function PricingTab({ ctx }) {
  const { master, setMaster, isAdmin } = ctx;
  const [venueId, setVenueId] = useState(master.venues[0]?.id || '');
  const [editingGroup, setEditingGroup] = useState(null); // null | 'new' | groupObject
  const [showQuickSetup, setShowQuickSetup] = useState(false);

  const venueCourts = master.courts.filter(c => c.venueId === venueId);
  const venueCourtIds = new Set(venueCourts.map(c => c.id));
  const courtNameOf = (id) => venueCourts.find(c => c.id === id)?.name || '—';

  // group rules that were created together (same ruleGroupId) so a venue-wide
  // rule shows as ONE row, not one row per court
  const groups = useMemo(() => {
    const rulesInVenue = master.pricing.filter(p => venueCourtIds.has(p.courtId));
    const byKey = {};
    rulesInVenue.forEach(p => {
      const key = p.ruleGroupId || p.id;
      if (!byKey[key]) byKey[key] = { key, courtIds: [], sample: p };
      byKey[key].courtIds.push(p.courtId);
    });
    return Object.values(byKey).sort((a, b) => (a.sample.startTime || '').localeCompare(b.sample.startTime || ''));
  }, [master.pricing, venueId, master.courts]); // eslint-disable-line

  function saveGroup(form, existingKey) {
    let pricing = master.pricing;
    if (existingKey) pricing = pricing.filter(p => (p.ruleGroupId || p.id) !== existingKey);
    const base = {
      label: form.label, dayType: form.dayType, startTime: form.startTime, endTime: form.endTime,
      price: form.price, category: form.category, effectiveFrom: form.effectiveFrom, effectiveUntil: form.effectiveUntil,
    };
    let added;
    if (form.applyMode === 'venue') {
      const groupId = uid('rg');
      added = venueCourts.map(c => ({ id: uid('pr'), courtId: c.id, ruleGroupId: groupId, ...base }));
    } else {
      added = [{ id: uid('pr'), courtId: form.singleCourtId, ruleGroupId: null, ...base }];
    }
    setMaster({ ...master, pricing: [...pricing, ...added] });
    setEditingGroup(null);
  }
  function deleteGroup(key) {
    setMaster({ ...master, pricing: master.pricing.filter(p => (p.ruleGroupId || p.id) !== key) });
  }

  function saveQuickSetup(form) {
    // Replace only the rules this wizard previously generated for this venue
    // (tagged quickSetup: true) — any custom rules added separately are untouched.
    const kept = master.pricing.filter(p => !(venueCourtIds.has(p.courtId) && p.quickSetup));
    const weekendRows = form.weekendOffPeak
      ? [
          { dayType: 'weekend', startTime: form.weekendOffPeakStart, endTime: form.weekendOffPeakEnd, price: form.weekendOffPeakPrice, category: 'off_peak', label: 'Weekend off-peak' },
          ...complementRanges(form.weekendOffPeakStart, form.weekendOffPeakEnd).map((r, i, arr) => ({
            dayType: 'weekend', startTime: r.start, endTime: r.end, price: form.peakPrice, category: 'peak',
            label: arr.length > 1 ? `Weekend peak (slot ${i + 1})` : 'Weekend peak',
          })),
        ]
      : [{ dayType: 'weekend', startTime: '00:00', endTime: '23:59', price: form.peakPrice, category: 'peak', label: 'Weekend (all day, peak rate)' }];
    const rows = [
      { dayType: 'weekday', startTime: form.offPeakStart, endTime: form.offPeakEnd, price: form.offPeakPrice, category: 'off_peak', label: 'Weekday off-peak' },
      ...form.peakSlots.map((s, i) => ({
        dayType: 'weekday', startTime: s.start, endTime: s.end, price: form.peakPrice, category: 'peak',
        label: form.peakSlots.length > 1 ? `Weekday peak (slot ${i + 1})` : 'Weekday peak',
      })),
      ...weekendRows,
    ];
    const added = [];
    rows.forEach(row => {
      const groupId = uid('rg');
      venueCourts.forEach(c => added.push({
        id: uid('pr'), courtId: c.id, ruleGroupId: groupId, quickSetup: true,
        effectiveFrom: form.effectiveFrom, effectiveUntil: '', ...row,
      }));
    });
    setMaster({ ...master, pricing: [...kept, ...added] });
    setShowQuickSetup(false);
  }

  if (master.venues.length === 0) {
    return <TabWrap title="Pricing" eyebrow="Peak / off-peak / special"><EmptyState icon={DollarSign} title="Add a venue first" body="Set pricing once you've added a venue and at least one court." /></TabWrap>;
  }

  return (
    <TabWrap title="Pricing" eyebrow="Set once per venue · historically preserved">
      <div style={styles.filterRow}>
        <Select value={venueId} onChange={setVenueId} options={master.venues.map(v => ({ value: v.id, label: v.name }))} />
        {isAdmin && venueCourts.length > 0 && <button style={styles.primaryBtn} onClick={() => setShowQuickSetup(true)}><DollarSign size={13} /> Quick setup: peak / off-peak</button>}
        {isAdmin && venueCourts.length > 0 && <button style={styles.ghostBtn} onClick={() => setEditingGroup('new')}><Plus size={14} /> Add custom rule</button>}
      </div>

      {venueCourts.length === 0 ? <div style={styles.mutedNote}>Add a court to this venue first (Venues &amp; Courts tab).</div> : (
        groups.length === 0 ? <div style={styles.mutedNote}>No pricing set for this venue yet. Use "Quick setup" for the common weekday off-peak / peak / weekend split — it covers all {venueCourts.length} court{venueCourts.length === 1 ? '' : 's'} here in one go.</div> : (
          <table style={styles.table}>
            <thead><tr>
              <th style={styles.th}>Label</th><th style={styles.th}>Applies</th><th style={styles.th}>Time</th>
              <th style={styles.th}>Category</th><th style={styles.th}>Price / hr</th><th style={styles.th}>Courts</th>
              <th style={styles.th}>Effective</th><th style={styles.th}></th>
            </tr></thead>
            <tbody>
              {groups.map(g => {
                const r = g.sample;
                const allCourts = g.courtIds.length === venueCourts.length && !!r.ruleGroupId;
                return (
                  <tr key={g.key}>
                    <td style={styles.td}>{r.label || '—'}</td>
                    <td style={styles.td}>{DAY_TYPE_OPTIONS.find(d => d.value === r.dayType)?.label}</td>
                    <td style={{ ...styles.td, fontFamily: 'var(--font-mono)' }}>{r.startTime}–{r.endTime}</td>
                    <td style={styles.td}><Badge tone={r.category}>{r.category.replace('_', ' ')}</Badge></td>
                    <td style={{ ...styles.td, fontFamily: 'var(--font-mono)' }}>{fmtMoney(r.price)}</td>
                    <td style={styles.td}>{allCourts ? <Badge tone="weekday">All {venueCourts.length} courts</Badge> : g.courtIds.map(courtNameOf).join(', ')}</td>
                    <td style={{ ...styles.td, fontFamily: 'var(--font-mono)', fontSize: 12 }}>{r.effectiveFrom || '—'} → {r.effectiveUntil || 'ongoing'}</td>
                    <td style={styles.td}>
                      {isAdmin && <button style={styles.iconBtnSm} onClick={() => setEditingGroup(g)}><Edit2 size={12} /></button>}
                      {isAdmin && <button style={styles.iconBtnSm} onClick={() => deleteGroup(g.key)}><Trash2 size={12} /></button>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )
      )}

      {showQuickSetup && (
        <QuickPricingModal
          existingRules={master.pricing.filter(p => venueCourtIds.has(p.courtId) && p.quickSetup)}
          venueCourtCount={venueCourts.length}
          onSave={saveQuickSetup}
          onClose={() => setShowQuickSetup(false)}
        />
      )}

      {editingGroup && (
        <PricingModal
          group={editingGroup === 'new' ? null : editingGroup}
          venueCourts={venueCourts}
          onSave={(form) => saveGroup(form, editingGroup === 'new' ? null : editingGroup.key)}
          onClose={() => setEditingGroup(null)}
        />
      )}
    </TabWrap>
  );
}

function QuickPricingModal({ existingRules, venueCourtCount, onSave, onClose }) {
  const offPeakRule = existingRules.find(r => r.category === 'off_peak' && r.dayType === 'weekday');
  const peakRules = existingRules.filter(r => r.category === 'peak' && r.dayType === 'weekday');
  // dedupe to one entry per slot (same slot is duplicated across every court)
  const peakSlotMap = {};
  peakRules.forEach(r => { peakSlotMap[r.ruleGroupId || r.id] = r; });
  const dedupedPeakRules = Object.values(peakSlotMap).sort((a, b) => a.startTime.localeCompare(b.startTime));
  const initialPeakSlots = dedupedPeakRules.length
    ? dedupedPeakRules.map(r => ({ start: r.startTime, end: r.endTime }))
    : [{ start: '16:00', end: '23:59' }];

  const weekendOffPeakRule = existingRules.find(r => r.category === 'off_peak' && r.dayType === 'weekend');

  const [f, setF] = useState({
    offPeakPrice: offPeakRule?.price ?? 2500,
    offPeakStart: offPeakRule?.startTime ?? '06:00',
    offPeakEnd: offPeakRule?.endTime ?? '16:00',
    peakPrice: dedupedPeakRules[0]?.price ?? 3500,
    peakSlots: initialPeakSlots,
    weekendOffPeak: !!weekendOffPeakRule,
    weekendOffPeakPrice: weekendOffPeakRule?.price ?? (offPeakRule?.price ?? 2500),
    weekendOffPeakStart: weekendOffPeakRule?.startTime ?? '06:00',
    weekendOffPeakEnd: weekendOffPeakRule?.endTime ?? '09:00',
    effectiveFrom: offPeakRule?.effectiveFrom || todayStr(),
  });
  function set(k, v) { setF(prev => ({ ...prev, [k]: v })); }
  function setSlot(i, field, value) {
    setF(prev => {
      const slots = prev.peakSlots.map((s, idx) => idx === i ? { ...s, [field]: value } : s);
      return { ...prev, peakSlots: slots };
    });
  }
  function addSlot() {
    setF(prev => ({ ...prev, peakSlots: [...prev.peakSlots, { start: '06:00', end: '09:00' }] }));
  }
  function removeSlot(i) {
    setF(prev => ({ ...prev, peakSlots: prev.peakSlots.filter((_, idx) => idx !== i) }));
  }

  return (
    <Modal title="Quick setup: peak / off-peak pricing" onClose={onClose}>
      <div style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 16 }}>
        Applies to all {venueCourtCount} court{venueCourtCount === 1 ? '' : 's'} at this venue. By default weekends are priced at your peak rate all day — tick the box below if this venue also has a weekend off-peak window.
      </div>

      <div style={{ background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 8, padding: 14, marginBottom: 14 }}>
        <div style={{ fontWeight: 800, fontSize: 12.5, marginBottom: 10, textTransform: 'uppercase', letterSpacing: '.04em', color: 'var(--muted)' }}>Weekday off-peak</div>
        <Field label="Off-peak price per hour (Rs)"><input type="number" style={styles.input} value={f.offPeakPrice} onChange={e => set('offPeakPrice', parseFloat(e.target.value) || 0)} /></Field>
        <div style={styles.formRow} className="form-row">
          <Field label="From"><input type="time" style={styles.input} value={f.offPeakStart} onChange={e => set('offPeakStart', e.target.value)} /></Field>
          <Field label="To"><input type="time" style={styles.input} value={f.offPeakEnd} onChange={e => set('offPeakEnd', e.target.value)} /></Field>
        </div>
      </div>

      <div style={{ background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 8, padding: 14, marginBottom: 14 }}>
        <div style={{ fontWeight: 800, fontSize: 12.5, marginBottom: 10, textTransform: 'uppercase', letterSpacing: '.04em', color: 'var(--muted)' }}>Weekday peak</div>
        <Field label="Peak price per hour (Rs)"><input type="number" style={styles.input} value={f.peakPrice} onChange={e => set('peakPrice', parseFloat(e.target.value) || 0)} /></Field>

        {f.peakSlots.map((slot, i) => (
          <div key={i} style={{ display: 'flex', gap: 10, alignItems: 'flex-end', marginBottom: 4 }}>
            <div style={styles.formRow} className="form-row">
              <Field label={f.peakSlots.length > 1 ? `Slot ${i + 1} — From` : 'From'}>
                <input type="time" style={styles.input} value={slot.start} onChange={e => setSlot(i, 'start', e.target.value)} />
              </Field>
              <Field label={f.peakSlots.length > 1 ? `Slot ${i + 1} — To` : 'To'}>
                <input type="time" style={styles.input} value={slot.end} onChange={e => setSlot(i, 'end', e.target.value)} />
              </Field>
            </div>
            {f.peakSlots.length > 1 && (
              <button style={{ ...styles.iconBtnSm, marginBottom: 12 }} onClick={() => removeSlot(i)} title="Remove this slot"><X size={12} /></button>
            )}
          </div>
        ))}
        <button style={{ ...styles.ghostBtn, marginTop: 6 }} onClick={addSlot}>
          <Plus size={13} /> Add another peak time slot
        </button>
        <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 8 }}>
          e.g. an early-morning peak and a separate evening peak — both priced at the same peak rate above.
        </div>
      </div>

      <div style={{ background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 8, padding: 14, marginBottom: 14 }}>
        <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: 12.5, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '.04em', color: 'var(--muted)', marginBottom: f.weekendOffPeak ? 10 : 0 }}>
          <input type="checkbox" checked={f.weekendOffPeak} onChange={e => set('weekendOffPeak', e.target.checked)} />
          Weekend
        </label>
        {!f.weekendOffPeak ? (
          <div style={{ fontSize: 12, color: 'var(--muted)', display: 'flex', alignItems: 'center', gap: 6, marginTop: 8 }}>
            <Badge tone="weekend">All day</Badge> @ {fmtMoney(f.peakPrice)}/hr (your peak rate)
          </div>
        ) : (
          <>
            <div style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 10 }}>
              This venue also has a cheaper weekend off-peak window. The rest of the weekend stays at your peak rate ({fmtMoney(f.peakPrice)}/hr).
            </div>
            <Field label="Weekend off-peak price per hour (Rs)"><input type="number" style={styles.input} value={f.weekendOffPeakPrice} onChange={e => set('weekendOffPeakPrice', parseFloat(e.target.value) || 0)} /></Field>
            <div style={styles.formRow} className="form-row">
              <Field label="From"><input type="time" style={styles.input} value={f.weekendOffPeakStart} onChange={e => set('weekendOffPeakStart', e.target.value)} /></Field>
              <Field label="To"><input type="time" style={styles.input} value={f.weekendOffPeakEnd} onChange={e => set('weekendOffPeakEnd', e.target.value)} /></Field>
            </div>
          </>
        )}
      </div>

      <Field label="Effective from"><input type="date" style={styles.input} value={f.effectiveFrom} onChange={e => set('effectiveFrom', e.target.value)} /></Field>
      <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: -4, marginBottom: 8 }}>
        <Info size={11} style={{ verticalAlign: '-1px', marginRight: 4 }} />
        Running this again later replaces these three rules with your new numbers — any custom rules you've added separately are left alone.
      </div>
      <ModalFooter onClose={onClose} onSave={() => onSave(f)} disabled={!f.offPeakPrice || !f.peakPrice || (f.weekendOffPeak && !f.weekendOffPeakPrice)} />
    </Modal>
  );
}


function PricingModal({ group, venueCourts, onSave, onClose }) {
  const r = group?.sample;
  const initialApplyMode = group ? (group.courtIds.length > 1 || !!r.ruleGroupId ? 'venue' : 'court') : 'venue';
  const looksFlat = r && r.dayType === 'all' && r.startTime === '00:00' && r.endTime === '23:59';
  const [flatRate, setFlatRate] = useState(group ? looksFlat : false);
  const [f, setF] = useState({
    label: r?.label || '', dayType: r?.dayType || 'weekday', startTime: r?.startTime || '06:00', endTime: r?.endTime || '16:00',
    price: r?.price ?? 2500, category: r?.category || 'off_peak', effectiveFrom: r?.effectiveFrom || todayStr(), effectiveUntil: r?.effectiveUntil || '',
    applyMode: initialApplyMode, singleCourtId: (group && initialApplyMode === 'court') ? group.courtIds[0] : (venueCourts[0]?.id || ''),
  });
  function set(k, v) { setF(prev => ({ ...prev, [k]: v })); }

  function toggleFlatRate(checked) {
    setFlatRate(checked);
    if (checked) {
      setF(prev => ({ ...prev, dayType: 'all', startTime: '00:00', endTime: '23:59', category: 'off_peak', label: prev.label || 'Flat rate (all day, every day)' }));

  return (
    <Modal title={group ? 'Edit pricing rule' : 'Add pricing rule'} onClose={onClose}>
      <Field label="Applies to">
        <div style={{ display: 'flex', gap: 14, fontSize: 13 }}>
          <label style={{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
            <input type="radio" checked={f.applyMode === 'venue'} onChange={() => set('applyMode', 'venue')} />
            All {venueCourts.length} court{venueCourts.length === 1 ? '' : 's'} at this venue

          <label style={{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
            <input type="radio" checked={f.applyMode === 'court'} onChange={() => set('applyMode', 'court')} />

      )}

      <div style={{ background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 8, padding: '10px 12px', marginBottom: 14 }}>
        <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: 13, fontWeight: 700 }}>
          <input type="checkbox" checked={flatRate} onChange={e => toggleFlatRate(e.target.checked)} />
          This venue has no separate peak / off-peak pricing — one flat rate all day
        </label>
      </div>

      <Field label="Label (optional)"><input style={styles.input} value={f.label} onChange={e => set('label', e.target.value)} placeholder={flatRate ? 'e.g. Standard rate' : 'e.g. Weekday evening peak'} /></Field>

      {!flatRate && (
        <>
          <div style={styles.formRow} className="form-row">
            <Field label="Applies on"><Select value={f.dayType} onChange={v => set('dayType', v)} options={DAY_TYPE_OPTIONS} /></Field>
            <Field label="Category"><Select value={f.category} onChange={v => set('category', v)} options={PRICING_CATEGORIES} /></Field>
          </div>
          <div style={styles.formRow} className="form-row">
            <Field label="Start time"><input type="time" style={styles.input} value={f.startTime} onChange={e => set('startTime', e.target.value)} /></Field>
            <Field label="End time"><input type="time" style={styles.input} value={f.endTime} onChange={e => set('endTime', e.target.value)} /></Field>
          </div>
        </>
      )}
      {flatRate && (
        <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: -8, marginBottom: 12 }}>
          Applies every day, all 24 hours, tagged as off-peak — this is the only rate needed for this venue.
        </div>
      )}

      <Field label="Price per hour (Rs)"><input type="number" style={styles.input} value={f.price} onChange={e => set('price', parseFloat(e.target.value) || 0)} /></Field>
      <div style={styles.formRow} className="form-row">
        <Field label="Effective from"><input type="date" style={styles.input} value={f.effectiveFrom} onChange={e => set('effectiveFrom', e.target.value)} /></Field>
        <Field label="Effective until (optional)"><input type="date" style={styles.input} value={f.effectiveUntil} onChange={e => set('effectiveUntil', e.target.value)} /></Field>
      </div>
      <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: -4, marginBottom: 8 }}>
        <Info size={11} style={{ verticalAlign: '-1px', marginRight: 4 }} />
        Leave "effective until" blank for an ongoing rate. Changing a price later doesn't rewrite history — set a new effective date instead.
      </div>
      <ModalFooter onClose={onClose} onSave={() => onSave(f)} disabled={!f.price} />

  const [mode, setMode] = useState('week'); // 'day' | 'week'
  const [venueId, setVenueId] = useState(master.venues[0]?.id || '');
  const [courtId, setCourtId] = useState('');
  const [date, setDate] = useState(todayStr());
  const [weekAnchor, setWeekAnchor] = useState(todayStr());

  const venue = master.venues.find(v => v.id === venueId);
  const venueCourts = master.courts.filter(c => c.venueId === venueId);
  useEffect(() => { if (!venueCourts.some(c => c.id === courtId)) setCourtId(venueCourts[0]?.id || ''); }, [venueId]); // eslint-disable-line
  const court = master.courts.find(c => c.id === courtId);

  if (master.venues.length === 0) {
    return <TabWrap title="Log Occupancy" eyebrow="Calendar entry, court by court"><EmptyState icon={CircleDot} title="Add a venue first" body="You need at least one venue and court before logging occupancy." /></TabWrap>;
  }

  return (
    <TabWrap title="Log Occupancy" eyebrow="Calendar entry, court by court">
      <div style={styles.filterRow}>
        <Select value={venueId} onChange={setVenueId} options={master.venues.map(v => ({ value: v.id, label: v.name }))} />
        <Select value={courtId} onChange={setCourtId} options={venueCourts.map(c => ({ value: c.id, label: c.name }))} placeholder={venueCourts.length ? undefined : 'No courts'} />
        <div style={styles.modeToggle}>
          <button onClick={() => setMode('week')} style={{ ...styles.modeToggleBtn, ...(mode === 'week' ? styles.modeToggleBtnActive : {}) }}>Week</button>
          <button onClick={() => setMode('day')} style={{ ...styles.modeToggleBtn, ...(mode === 'day' ? styles.modeToggleBtnActive : {}) }}>Day</button>
        </div>
      </div>

      {!court ? <div style={styles.mutedNote}>Add a court to this venue first — go to Venues &amp; Courts, open this venue, and click "Add court".</div> : (
        mode === 'week'
          ? <WeekEntry ctx={ctx} venue={venue} court={court} anchor={weekAnchor} setAnchor={setWeekAnchor} />
          : <DayEntry ctx={ctx} venue={venue} court={court} date={date} setDate={setDate} />
      )}
    </TabWrap>
  );
}

function DayEntry({ ctx, venue, court, date, setDate }) {
  const { master, occData, persistOccMonth, isAdmin } = ctx;
  const courtId = court.id;
  const monthKey = monthKeyOf(date);
  const hours = (occData[monthKey]?.[courtId]?.[date]) || defaultHourStates(...Object.values(courtHours(court, venue)));

  // If hours were marked occupied before any pricing rule existed for this
  // court, backfill the price now that a rule exists — but never touch an
  // hour that already has a price (pricing history stays intact).
  useEffect(() => {
    let changed = false;
    const next = hours.map((h, i) => {
      if (h.state === 'occupied' && h.price == null) {
        const rule = matchPricingRule(master.pricing, courtId, date, i);
        if (rule) { changed = true; return { ...h, price: rule.price, category: rule.category }; }
      }
      return h;
    });
    if (!changed) return;
    const monthData = { ...(occData[monthKey] || {}) };
    monthData[courtId] = { ...(monthData[courtId] || {}), [date]: next };
    persistOccMonth(monthKey, monthData);
  }, [courtId, date, master.pricing, occData[monthKey]]); // eslint-disable-line

  function cycleState(h) {
    if (!isAdmin) return;
    const next = hours.map((x, i) => {
      if (i !== h) return x;
      const order = ['closed', 'available', 'occupied', 'event'];
      const idx = order.indexOf(x.state);
      const nextState = order[(idx + 1) % order.length];
      let price = x.price, category = x.category;
      if (nextState === 'occupied') {
        const rule = matchPricingRule(master.pricing, courtId, date, h);
        price = rule ? rule.price : x.price;
        category = rule ? rule.category : x.category;
      } else if (nextState === 'event') {
        price = null; category = null; // events never count toward revenue
      }
      return { state: nextState, price, category };
    });
    const monthData = { ...(occData[monthKey] || {}) };
    monthData[courtId] = { ...(monthData[courtId] || {}), [date]: next };
    persistOccMonth(monthKey, monthData);
  }

  function resetDay() {
    if (!isAdmin) return;
    if (!confirm('Reset this day to default open/closed hours? Any bookings logged for it will be lost.')) return;
    const fresh = defaultHourStates(...Object.values(courtHours(court, venue)));
    const monthData = { ...(occData[monthKey] || {}) };
    monthData[courtId] = { ...(monthData[courtId] || {}), [date]: fresh };
    persistOccMonth(monthKey, monthData);
  }

  const avail = 24; // fixed 24-hour basis, regardless of declared opening hours
  const occ = hours.filter(h => h.state === 'occupied').length;
  const evt = hours.filter(h => h.state === 'event').length;
  const rev = hours.filter(h => h.state === 'occupied').reduce((s, h) => s + (h.price || 0), 0);
  const pct = safeDiv(occ, avail) * 100;

  return (
    <>
      <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginBottom: 14, flexWrap: 'wrap' }}>
        <input type="date" style={styles.input} value={date} onChange={e => setDate(e.target.value)} />
        {isAdmin && <button style={styles.ghostBtn} onClick={resetDay}><RefreshCw size={13} /> Reset day</button>}
        {!isAdmin && <div style={{ fontSize: 11.5, color: 'var(--muted)' }}>View-only — log in as admin to edit.</div>}
      </div>

      <div style={styles.legendRow}>
        <LegendDot color="var(--border)" label="Closed (tap to open)" />
        <LegendDot color="#BFE0CC" label="Available" />
        <LegendDot color="var(--court)" label="Occupied" />
        <LegendDot color="var(--ball)" label="Booked for event" />
      </div>

      <div style={styles.hourGrid} className="hour-grid">
        {hours.map((h, i) => {
          const bg = h.state === 'closed' ? 'var(--bg)' : h.state === 'occupied' ? 'var(--court)' : h.state === 'event' ? 'var(--ball)' : '#BFE0CC';
          return (
            <button key={i} onClick={() => cycleState(i)} disabled={!isAdmin} style={{
              ...styles.hourCell,
              background: bg,
              borderColor: h.state === 'closed' ? 'var(--border)' : 'transparent',
              color: h.state === 'occupied' ? '#fff' : 'var(--ink)',
              cursor: isAdmin ? 'pointer' : 'default',
              opacity: isAdmin ? 1 : 0.85,
            }}>
              <span style={{ fontSize: 11, fontWeight: 700 }}>{hourLabel(i)}</span>
              {h.state === 'occupied' && h.price != null && <span style={{ fontSize: 9, fontFamily: 'var(--font-mono)', opacity: 0.9 }}>{fmtMoney(h.price)}</span>}
              {h.state === 'event' && <span style={{ fontSize: 8, opacity: 0.8, fontWeight: 700, textTransform: 'uppercase' }}>Event</span>}
              {h.state === 'occupied' && h.category && <span style={{ fontSize: 8, opacity: 0.75, textTransform: 'uppercase' }}>{h.category.replace('_', ' ')}</span>}
            </button>
          );
        })}
      </div>

      <div style={styles.statGrid} className="stat-grid">
        <StatBlock label="Total hrs (24h)" value={avail} />
        <StatBlock label="Occupied hrs" value={occ} />
        <StatBlock label="Event hrs" value={evt} accent="var(--ball-dark)" />
        <StatBlock label="Occupancy" value={fmtPct(pct)} accent="var(--court)" />
        <StatBlock label="Est. revenue" value={fmtMoney(rev)} accent="var(--ball-dark)" />
      </div>
    </>
  );
}

function WeekEntry({ ctx, venue, court, anchor, setAnchor }) {
  const { master, occData, persistOccMonth } = ctx;
  const courtId = court.id;
  const monday = startOfWeekMonday(anchor);
  const days = weekDates(monday);
  const { open, close } = courtHours(court, venue);
  const openMin = timeToMin(open);
  let closeMin = timeToMin(close);
  if (closeMin <= openMin) closeMin += 24 * 60; // "12:00 AM" close = midnight = end of day, not hour 0
  const openHour = Math.floor(openMin / 60);
  const closeHourExclusive = Math.min(24, Math.ceil(closeMin / 60));
  const hourRows = [];
  for (let h = openHour; h < closeHourExclusive; h++) hourRows.push(h);

  function hoursFor(dateStr) {
    const mKey = monthKeyOf(dateStr);
    return (occData[mKey]?.[courtId]?.[dateStr]) || defaultHourStates(...Object.values(courtHours(court, venue)));
  }

  // Backfill any occupied hour in the visible week that's missing a price
  // now that a matching rule exists — hours that already have a price are
  // left untouched. This is a data correction, not an occupancy edit.
  useEffect(() => {
    const byMonth = {};
    days.forEach(d => {
      const mKey = monthKeyOf(d);
      const dayHours = hoursFor(d);
      let changed = false;
      const next = dayHours.map((h, i) => {
        if (i < openHour || i >= closeHourExclusive) return h;
        if (h.state === 'occupied' && h.price == null) {
          const rule = matchPricingRule(master.pricing, courtId, d, i);
          if (rule) { changed = true; return { ...h, price: rule.price, category: rule.category }; }
        }
        return h;
      });
      if (changed) {
        if (!byMonth[mKey]) byMonth[mKey] = { ...(occData[mKey] || {}) };
        byMonth[mKey][courtId] = { ...(byMonth[mKey][courtId] || {}), [d]: next };
      }
    });
    Object.entries(byMonth).forEach(([mKey, monthData]) => persistOccMonth(mKey, monthData));
  }, [courtId, monday, master.pricing, occData]); // eslint-disable-line

  // week-level stats — always derived live from the same records the Day
  // view edits, so this updates automatically as bookings change. Occupancy
  // is judged on a fixed 24 hours/day basis, not the displayed operating window.
  let occ = 0, rev = 0, evt = 0;
  days.forEach(d => {
    hoursFor(d).forEach((h) => {
      if (h.state === 'event') { evt++; return; }
      if (h.state === 'occupied') { occ++; rev += (h.price || 0); }
    });
  });
  const avail = days.length * 24;
  const pct = safeDiv(occ, avail) * 100;

  return (
    <>
      <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginBottom: 14, flexWrap: 'wrap' }}>
        <button style={styles.iconBtn} onClick={() => setAnchor(addDaysStr(monday, -7))}><ChevronRight size={14} style={{ transform: 'rotate(180deg)' }} /></button>
        <div style={{ fontWeight: 700, fontSize: 14 }}>{fmtShortDate(days[0])} – {fmtShortDate(days[6])}</div>
        <button style={styles.iconBtn} onClick={() => setAnchor(addDaysStr(monday, 7))}><ChevronRight size={14} /></button>
        <button style={styles.ghostBtn} onClick={() => setAnchor(todayStr())}>This week</button>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 10, marginBottom: 14 }}>
        <div style={styles.legendRow}>
          <LegendDot color="#BFE0CC" label="Available" />
          <LegendDot color="var(--court)" label="Occupied" />
          <LegendDot color="var(--ball)" label="Event" />
        </div>
        <div style={{ fontSize: 11.5, color: 'var(--muted)' }}>
          Read-only summary — click into a day on the <b>Day</b> tab above to log or change bookings.
        </div>
      </div>

      <Card>
        <div style={styles.heatmapWrap}>
          <div style={{ ...styles.heatmapGrid, gridTemplateColumns: `54px repeat(7, 60px)`, gap: 4 }}>
            <div />
            {days.map(d => (
              <div key={d} style={styles.weekColHead}>
                <div>{DAY_SHORT[days.indexOf(d)]}</div>
                <div style={{ fontWeight: 400, fontSize: 10, color: 'var(--muted)' }}>{fmtShortDate(d)}</div>
              </div>
            ))}
            {hourRows.map(h => (
              <React.Fragment key={h}>
                <div style={styles.heatmapRowHead}>{hourLabel(h)}</div>
                {days.map(d => {
                  const cell = hoursFor(d)[h];
                  const isOccupied = cell.state === 'occupied';
                  const isEvent = cell.state === 'event';
                  return (
                    <div key={d + h}
                      title={`${DAY_NAMES[dateToDow(d)]} ${fmtShortDate(d)}, ${hourLabel(h)}${isOccupied && cell.price != null ? ' — ' + fmtMoney(cell.price) : ''}${isEvent ? ' — event' : ''}`}
                      style={{
                        ...styles.weekCell, cursor: 'default',
                        background: isOccupied ? 'var(--court)' : isEvent ? 'var(--ball)' : '#BFE0CC',
                        color: isOccupied ? '#fff' : 'var(--ink)',
                      }}>
                      {isOccupied && cell.price != null ? <span style={{ fontSize: 8, fontFamily: 'var(--font-mono)' }}>{Math.round(cell.price / 100) / 10}k</span> : null}
                    </div>
                  );
                })}
              </React.Fragment>
            ))}
          </div>
        </div>
      </Card>

      <div style={styles.statGrid} className="stat-grid">
        <StatBlock label="Total hrs (week, 24h)" value={avail} />
        <StatBlock label="Occupied hrs (week)" value={occ} />
        <StatBlock label="Event hrs (week)" value={evt} accent="var(--ball-dark)" />
        <StatBlock label="Week occupancy" value={fmtPct(pct)} accent="var(--court)" />
        <StatBlock label="Week est. revenue" value={fmtMoney(rev)} accent="var(--ball-dark)" />

}
