/* =========================================================================
   HEATMAP TAB
========================================================================= */

function HeatmapTab({ ctx }) {
  const { master, flatRows } = ctx;
  const [province, setProvince] = useState('');
  const [district, setDistrict] = useState('');
  const [city, setCity] = useState('');
  const [venueId, setVenueId] = useState('');
  const [days, setDays] = useState(60);

  const districts = province ? PROVINCE_DISTRICTS[province] : [...new Set(master.venues.map(v => v.district))];
  const cities = [...new Set(master.venues.filter(v => (!province || v.province === province) && (!district || v.district === district)).map(v => v.city))];
  const venueOptions = master.venues.filter(v => (!province || v.province === province) && (!district || v.district === district) && (!city || v.city === city));

  const since = addDaysStr(todayStr(), -days);
  let rows = flatRows.filter(r => r.date >= since);
  if (province) rows = rows.filter(r => r.province === province);
  if (district) rows = rows.filter(r => r.district === district);
  if (city) rows = rows.filter(r => r.city === city);
  if (venueId) rows = rows.filter(r => r.venueId === venueId);

  // grid[dayIdx][hour] = { occ, avail }
  const grid = Array.from({ length: 7 }, () => Array.from({ length: 24 }, () => ({ occ: 0, avail: 0 })));
  rows.forEach(r => {
    const dow = dateToDow(r.date); // 0=Sun..6=Sat
    const colIdx = DAY_SHORT_IDX.indexOf(dow); // position within Mon..Sun
    grid[colIdx][r.hour].avail++;
    if (r.occupied) grid[colIdx][r.hour].occ++;
  });

  return (
    <TabWrap title="24 × 7 Hotspot Heatmap" eyebrow="Occupied ÷ available court-hours">
      <div style={styles.filterRow}>
        <Select value={province} onChange={v => { setProvince(v); setDistrict(''); setCity(''); setVenueId(''); }} placeholder="All provinces" options={PROVINCES} />
        <Select value={district} onChange={v => { setDistrict(v); setCity(''); setVenueId(''); }} placeholder="All districts" options={districts} />
        <Select value={city} onChange={v => { setCity(v); setVenueId(''); }} placeholder="All cities" options={cities} />
        <Select value={venueId} onChange={setVenueId} placeholder="All venues" options={venueOptions.map(v => ({ value: v.id, label: v.name }))} />
        <Select value={String(days)} onChange={v => setDays(Number(v))} options={[{ value: '14', label: 'Last 14 days' }, { value: '30', label: 'Last 30 days' }, { value: '60', label: 'Last 60 days' }, { value: '90', label: 'Last 90 days' }]} />
      </div>

      {rows.length === 0 ? (
        <div style={styles.mutedNote}>No occupancy data logged for this scope / date range yet.</div>
      ) : (
        <Card>
          <div style={styles.heatmapWrap}>
            <div style={styles.heatmapGrid}>
              <div />
              {DAY_SHORT.map(d => <div key={d} style={styles.heatmapColHead}>{d}</div>)}
              {Array.from({ length: 24 }, (_, h) => (
                <React.Fragment key={h}>
                  <div style={styles.heatmapRowHead}>{hourLabel(h)}</div>
                  {DAY_SHORT.map((d, colIdx) => {
                    const cell = grid[colIdx][h];
                    const pct = cell.avail > 0 ? safeDiv(cell.occ, cell.avail) * 100 : null;
                    const lvl = pct != null ? hotspotFor(pct) : null;
                    return (
                      <div key={d + h} title={`${d} ${hourLabel(h)}: ${pct != null ? fmtPct(pct) : 'no data'}`}
                        style={{ ...styles.heatCell, background: lvl ? lvl.color : '#F1F1EE', opacity: pct == null ? 0.4 : 1 }}>
                        {pct != null && <span style={{ fontSize: 9, fontFamily: 'var(--font-mono)', color: lvl.max > 60 ? '#fff' : 'var(--ink)' }}>{Math.round(pct)}</span>}
                      </div>
                    );
                  })}
                </React.Fragment>
              ))}
            </div>
          </div>
          <div style={styles.legendRowWrap}>
            {HOTSPOT_LEVELS.map(l => (
              <div key={l.label} style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, color: 'var(--muted)' }}>
                <span style={{ width: 10, height: 10, borderRadius: 2, background: l.color }} /> {l.label}
              </div>
            ))}
          </div>
        </Card>
      )}
    </TabWrap>
  );
}

/* =========================================================================
   RANKINGS TAB
========================================================================= */

function RankingsTab({ ctx }) {
  const { master, flatRows, aggregate } = ctx;
  const [monthKey, setMonthKey] = useState(todayStr().slice(0, 7));
  const [week, setWeek] = useState(''); // '' = whole month, else index into weekRangesForMonth
  const [metric, setMetric] = useState('occupancyPct');

  const weeks = weekRangesForMonth(monthKey);
  useEffect(() => { setWeek(''); }, [monthKey]); // reset week choice when month changes

  let rows = flatRows.filter(r => monthKeyOf(r.date) === monthKey);
  if (week !== '') {
    const w = weeks[Number(week)];
    rows = rows.filter(r => {
      const day = parseInt(r.date.split('-')[2], 10);
      return day >= w.startDay && day <= w.endDay;
    });
  }

  const byVenue = groupAndAggregate(rows, r => r.venueName, aggregate)
    .filter(r => r.availableHours > 0).sort((a, b) => b[metric] - a[metric]);
  const byCity = groupAndAggregate(rows, r => r.city, aggregate)
    .filter(r => r.availableHours > 0).sort((a, b) => b[metric] - a[metric]);
  const byBusiness = groupAndAggregate(rows, r => r.business, aggregate)
    .filter(r => r.availableHours > 0).sort((a, b) => b[metric] - a[metric]);

  const metricOptions = [
    { value: 'occupancyPct', label: 'Occupancy %' },
    { value: 'revenue', label: 'Estimated revenue' },
    { value: 'revpah', label: 'RevPAH' },
    { value: 'occupiedHours', label: 'Occupied court-hours' },
  ];
  const fmt = (v, key) => key === 'occupancyPct' ? fmtPct(v) : key === 'revenue' || key === 'revpah' ? fmtMoney(v) : v.toLocaleString();

  return (
    <TabWrap title="Rankings" eyebrow="Venues, cities & businesses — by the booking's own date, not when it was entered">
      <div style={styles.filterRow}>
        <Select value={monthKey} onChange={setMonthKey} options={monthOptions()} />
        <Select value={week} onChange={setWeek} placeholder="Whole month" options={weeks.map((w, i) => ({ value: String(i), label: `${w.label} (${w.startDay}–${w.endDay})` }))} />
        <Select value={metric} onChange={setMetric} options={metricOptions} />
      </div>

      {rows.length === 0 ? <div style={styles.mutedNote}>No occupancy data logged for {monthLabel(monthKey)}{week !== '' ? `, ${weeks[Number(week)].label}` : ''} yet.</div> : (
        <div style={styles.threeCol} className="three-col">
          <Card eyebrow="Business leaderboard" title="Top businesses">
            <div style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 10 }}>Locations sharing a business name in Venues & Courts are combined here.</div>
            <RankList rows={byBusiness} metric={metric} fmt={fmt} />
          </Card>
          <Card eyebrow="Venue leaderboard" title="Top venues">
            <RankList rows={byVenue} metric={metric} fmt={fmt} />
          </Card>
          <Card eyebrow="City leaderboard" title="Top cities">
            <RankList rows={byCity} metric={metric} fmt={fmt} />
          </Card>
        </div>
      )}
    </TabWrap>
  );
}

function RankList({ rows, metric, fmt }) {
  if (rows.length === 0) return <div style={styles.mutedNote}>No data.</div>;
  const max = Math.max(...rows.map(r => r[metric]), 1);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      {rows.slice(0, 10).map((r, i) => (
        <div key={r.key} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={styles.rankNum}>{i + 1}</div>
          <div style={{ flex: 1 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5 }}>
              <span style={{ fontWeight: 700 }}>{r.key}</span>
              <span style={{ fontFamily: 'var(--font-mono)' }}>{fmt(r[metric], metric)}</span>
            </div>
            <div style={styles.miniBarTrack}>
              <div style={{ ...styles.miniBarFill, width: `${Math.max(3, (r[metric] / max) * 100)}%` }} />
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* =========================================================================
   BUSINESS TAB — deep dive per business (cross-location, pricing, trends)
========================================================================= */

function BusinessTab({ ctx }) {
  const { master, flatRows, aggregate } = ctx;
  const businesses = [...new Set(master.venues.map(v => v.business || v.name))].sort();
  const [businessName, setBusinessName] = useState(businesses[0] || '');
  const [monthKey, setMonthKey] = useState('all');
  const [week, setWeek] = useState('');

  useEffect(() => { if (businesses.length && !businesses.includes(businessName)) setBusinessName(businesses[0]); }, [master.venues]); // eslint-disable-line
  useEffect(() => { setWeek(''); }, [monthKey]);

  if (master.venues.length === 0 || businesses.length === 0) {
    return (
      <TabWrap title="Business" eyebrow="Deep dive per business">
        <EmptyState icon={Briefcase} title="No businesses yet" body="Add venues in Venues & Courts — give two locations the same Business/brand name to see them combined here." />
      </TabWrap>
    );
  }

  const weeks = monthKey === 'all' ? [] : weekRangesForMonth(monthKey);

  let bizRows = flatRows.filter(r => r.business === businessName);
  if (monthKey !== 'all') {
    bizRows = bizRows.filter(r => monthKeyOf(r.date) === monthKey);
    if (week !== '') {
      const w = weeks[Number(week)];
      bizRows = bizRows.filter(r => {
        const day = parseInt(r.date.split('-')[2], 10);
        return day >= w.startDay && day <= w.endDay;
      });
    }
  }
  const allBizRows = flatRows.filter(r => r.business === businessName); // unscoped, for trends

  const bizVenues = master.venues.filter(v => (v.business || v.name) === businessName);
  const bizCourts = master.courts.filter(c => bizVenues.some(v => v.id === c.venueId));
  const agg = aggregate(bizRows);

  const byLocation = groupAndAggregate(bizRows, r => r.venueName, aggregate).sort((a, b) => b.occupancyPct - a.occupancyPct);
  const revenueTotal = byLocation.reduce((s, l) => s + l.revenue, 0);
  const topLocationShare = byLocation.length && revenueTotal > 0 ? safeDiv(Math.max(...byLocation.map(l => l.revenue)), revenueTotal) * 100 : 0;
  const occPcts = byLocation.filter(l => l.availableHours > 0).map(l => l.occupancyPct);
  const occRange = occPcts.length ? { min: Math.min(...occPcts), max: Math.max(...occPcts) } : null;

  // peak vs off-peak mix, classified live against current pricing rules
  const withCategory = bizRows.map(r => {
    const rule = matchPricingRule(master.pricing, r.courtId, r.date, r.hour);
    return { ...r, liveCategory: rule ? rule.category : 'unclassified' };
  });
  const catOrder = ['peak', 'off_peak', 'special', 'unclassified'];
  const byCategory = groupAndAggregate(withCategory, r => r.liveCategory, aggregate).sort((a, b) => catOrder.indexOf(a.key) - catOrder.indexOf(b.key));

  // pricing consistency across this business's locations (weekday off-peak & peak)
  const locationPricing = bizVenues.map(v => {
    const vCourtIds = master.courts.filter(c => c.venueId === v.id).map(c => c.id);
    const rules = master.pricing.filter(p => vCourtIds.includes(p.courtId));
    const offPeak = rules.find(r => r.category === 'off_peak' && r.dayType === 'weekday');
    const peak = rules.find(r => r.category === 'peak' && r.dayType === 'weekday');
    return { venue: v.name, offPeakPrice: offPeak?.price ?? null, peakPrice: peak?.price ?? null };
  });
  const offPeakPrices = [...new Set(locationPricing.map(l => l.offPeakPrice).filter(p => p != null))];
  const peakPrices = [...new Set(locationPricing.map(l => l.peakPrice).filter(p => p != null))];
  const pricingConsistent = offPeakPrices.length <= 1 && peakPrices.length <= 1;

  // expansion signal — cities with no location from this business, ranked by overall market occupancy there
  const bizCities = new Set(bizVenues.map(v => v.city));
  const cityAgg = groupAndAggregate(flatRows, r => r.city, aggregate)
    .filter(c => !bizCities.has(c.key) && c.availableHours > 0)
    .sort((a, b) => b.occupancyPct - a.occupancyPct)
    .slice(0, 5);

  return (
    <TabWrap title={businessName} eyebrow="Business profile — every location rolled into one view">
      <div style={styles.filterRow}>
        <Select value={businessName} onChange={setBusinessName} options={businesses} />
        <Select value={monthKey} onChange={setMonthKey} options={[{ value: 'all', label: 'All time' }, ...monthOptions()]} />
        {monthKey !== 'all' && <Select value={week} onChange={setWeek} placeholder="Whole month" options={weeks.map((w, i) => ({ value: String(i), label: `${w.label} (${w.startDay}–${w.endDay})` }))} />}
      </div>

      <div style={styles.statGrid} className="stat-grid">
        <StatBlock label="Locations" value={bizVenues.length} />
        <StatBlock label="Courts" value={bizCourts.length} />
        <StatBlock label="Occupancy" value={fmtPct(agg.occupancyPct)} accent="var(--court)" />
        <StatBlock label="Est. revenue" value={fmtMoney(agg.revenue)} accent="var(--ball-dark)" />
        <StatBlock label="RevPAH" value={fmtMoney(agg.revpah)} sub="revenue / hr, 24h basis" />
        <StatBlock label="Event hrs" value={agg.eventHours.toLocaleString()} />
      </div>

      <Card eyebrow="Cross-location" title="Which location is winning" style={{ marginBottom: 16 }}>
        {byLocation.length === 0 ? <div style={styles.mutedNote}>No data logged for this business/period yet.</div> : (
          <>
            <table style={styles.table}>
              <thead><tr>
                <th style={styles.th}>Location</th><th style={styles.th}>Occupancy</th>
                <th style={styles.th}>Booked hrs</th><th style={styles.th}>Revenue</th><th style={styles.th}>Revenue share</th>
              </tr></thead>
              <tbody>
                {byLocation.map(l => (
                  <tr key={l.key}>
                    <td style={styles.td}><b>{l.key}</b></td>
                    <td style={styles.td}>{fmtPct(l.occupancyPct)}</td>
                    <td style={styles.td}>{l.occupiedHours.toLocaleString()}</td>
                    <td style={{ ...styles.td, fontFamily: 'var(--font-mono)' }}>{fmtMoney(l.revenue)}</td>
                    <td style={styles.td}>{fmtPct(safeDiv(l.revenue, revenueTotal) * 100)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 10 }}>
              Top location generates {fmtPct(topLocationShare)} of this business's revenue in scope{occRange ? ` · occupancy ranges ${fmtPct(occRange.min)}–${fmtPct(occRange.max)} across locations` : ''}.
            </div>
          </>
        )}
      </Card>

      <div style={styles.twoCol} className="two-col">
        <Card eyebrow="Pricing mix" title="Peak vs off-peak">
          {byCategory.length === 0 ? <div style={styles.mutedNote}>No data.</div> : (
            <table style={styles.table}>
              <thead><tr><th style={styles.th}>Category</th><th style={styles.th}>Occupancy</th><th style={styles.th}>Revenue</th></tr></thead>
              <tbody>
                {byCategory.map(c => (
                  <tr key={c.key}>
                    <td style={styles.td}><Badge tone={c.key}>{c.key.replace('_', ' ')}</Badge></td>
                    <td style={styles.td}>{fmtPct(c.occupancyPct)}</td>
                    <td style={{ ...styles.td, fontFamily: 'var(--font-mono)' }}>{fmtMoney(c.revenue)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </Card>

        <Card eyebrow="Pricing consistency" title="Same rates across locations?">
          <table style={styles.table}>
            <thead><tr><th style={styles.th}>Location</th><th style={styles.th}>Off-peak</th><th style={styles.th}>Peak</th></tr></thead>
            <tbody>
              {locationPricing.map(l => (
                <tr key={l.venue}>
                  <td style={styles.td}><b>{l.venue}</b></td>
                  <td style={{ ...styles.td, fontFamily: 'var(--font-mono)' }}>{l.offPeakPrice != null ? fmtMoney(l.offPeakPrice) : '—'}</td>
                  <td style={{ ...styles.td, fontFamily: 'var(--font-mono)' }}>{l.peakPrice != null ? fmtMoney(l.peakPrice) : '—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{ fontSize: 11, color: pricingConsistent ? 'var(--muted)' : 'var(--danger)', marginTop: 10, fontWeight: pricingConsistent ? 400 : 700 }}>
            {pricingConsistent ? 'Pricing is consistent across all locations.' : "Pricing differs between locations — worth checking if that's intentional."}
          </div>
        </Card>
      </div>

      <TrendsCard rows={allBizRows} aggregate={aggregate} />

      <Card eyebrow="Expansion signal" title="Cities without a location, ranked by market occupancy">
        {cityAgg.length === 0 ? <div style={styles.mutedNote}>Not enough citywide data logged yet.</div> : (
          <RankList rows={cityAgg} metric="occupancyPct" fmt={(v) => fmtPct(v)} />
        )}
        <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 10 }}>
          Based on overall market occupancy in each city (every business combined) — a starting signal, not a guarantee of demand for a new location.
        </div>
      </Card>
    </TabWrap>
  );
}

function PeakMixCard({ master, rows, aggregate }) {
  const withCategory = useMemo(() => rows.map(r => {
    const rule = matchPricingRule(master.pricing, r.courtId, r.date, r.hour);
    return { ...r, liveCategory: rule ? rule.category : 'unclassified' };
  }), [rows, master.pricing]);

  const order = ['peak', 'off_peak', 'special', 'unclassified'];
  const byCategory = groupAndAggregate(withCategory, r => r.liveCategory, aggregate)
    .sort((a, b) => order.indexOf(a.key) - order.indexOf(b.key));
  const totalRevenue = byCategory.reduce((s, c) => s + c.revenue, 0);

  return (
    <Card eyebrow="Pricing mix" title="Peak vs off-peak" style={{ marginBottom: 16 }}>
      {byCategory.length === 0 ? <div style={styles.mutedNote}>No data for this scope.</div> : (
        <table style={styles.table}>
          <thead><tr>
            <th style={styles.th}>Category</th><th style={styles.th}>Occupancy</th>
            <th style={styles.th}>Occupied hrs</th><th style={styles.th}>Revenue</th><th style={styles.th}>Revenue share</th>
          </tr></thead>
          <tbody>
            {byCategory.map(c => (
              <tr key={c.key}>
                <td style={styles.td}><Badge tone={c.key}>{c.key.replace('_', ' ')}</Badge></td>
                <td style={styles.td}>{fmtPct(c.occupancyPct)}</td>
                <td style={styles.td}>{c.occupiedHours.toLocaleString()}</td>
                <td style={{ ...styles.td, fontFamily: 'var(--font-mono)' }}>{fmtMoney(c.revenue)}</td>
                <td style={styles.td}>{fmtPct(safeDiv(c.revenue, totalRevenue) * 100)}</td>
              </tr>
            ))}

      </div>
    </Card>
  );
}

function ImpactRow({ label, a, b, fmt }) {
  const upliftPct = b > 0 ? ((a - b) / b) * 100 : null;
  const up = upliftPct != null && upliftPct >= 0;
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: '1px solid var(--border)', flexWrap: 'wrap', gap: 6 }}>
      <span style={{ fontSize: 12.5, color: 'var(--muted)' }}>{label}</span>
      <div style={{ display: 'flex', gap: 10, alignItems: 'baseline', fontFamily: 'var(--font-mono)', fontSize: 12.5 }}>
        <span>{fmt(a)} <span style={{ fontSize: 10, color: 'var(--muted)' }}>special</span></span>
        <span style={{ color: 'var(--muted)' }}>vs {fmt(b)} normal</span>
        {upliftPct != null && <span style={{ fontWeight: 800, color: up ? '#1F6B44' : 'var(--danger)' }}>{up ? '+' : ''}{upliftPct.toFixed(0)}%</span>}
      </div>
    </div>
  );
}

function SpecialDayCard({ rows, master, aggregate }) {
  function computeImpact(type, label) {
    const specialDates = Object.entries(master.specialDays).filter(([d, info]) => info.type === type).map(([d]) => d);
    if (specialDates.length === 0) return null;
    const specialRows = rows.filter(r => specialDates.includes(r.date));
    if (specialRows.length === 0) return null;
    const dows = new Set(specialDates.map(d => dateToDow(d)));
    const baselineRows = rows.filter(r => !r.special && dows.has(dateToDow(r.date)));
    const specialAgg = aggregate(specialRows);
    const baselineAgg = aggregate(baselineRows);
    const specialDayCount = new Set(specialRows.map(r => r.date)).size;
    const baselineDayCount = new Set(baselineRows.map(r => r.date)).size || 1;
    return {
      label, specialAgg, baselineAgg, specialDayCount,
      specialAvgDailyRevenue: specialAgg.revenue / (specialDayCount || 1),
      baselineAvgDailyRevenue: baselineAgg.revenue / baselineDayCount,
    };
  }

  const poya = computeImpact('poya', 'Poya days');
  const holiday = computeImpact('public_holiday', 'Public holidays');

  return (
    <Card eyebrow="Special days" title="Poya & holiday impact" style={{ marginBottom: 16 }}>
      {!poya && !holiday ? (
        <div style={styles.mutedNote}>Mark Poya days or public holidays in the Calendar tab — once you've logged occupancy on and around them, this compares them against normal days of the same weekday.</div>
      ) : (
        <div style={styles.twoCol} className="two-col">
          {[poya, holiday].filter(Boolean).map(x => (
            <div key={x.label}>
              <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 8 }}>
                {x.label} <span style={{ color: 'var(--muted)', fontWeight: 400 }}>({x.specialDayCount} day{x.specialDayCount === 1 ? '' : 's'} logged)</span>
              </div>
              <ImpactRow label="Occupancy" a={x.specialAgg.occupancyPct} b={x.baselineAgg.occupancyPct} fmt={fmtPct} />
              <ImpactRow label="Avg daily revenue" a={x.specialAvgDailyRevenue} b={x.baselineAvgDailyRevenue} fmt={fmtMoney} />
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

function TrendsCard({ rows, aggregate }) {
  const today = todayStr();
  const thisWeekStart = startOfWeekMonday(today);
  const lastWeekStart = addDaysStr(thisWeekStart, -7);
  const thisWeekRows = rows.filter(r => r.date >= thisWeekStart && r.date <= today);
  const lastWeekRows = rows.filter(r => r.date >= lastWeekStart && r.date < thisWeekStart);

  const thisMonthStart = today.slice(0, 7) + '-01';
  const prevMonthStart = addDaysStr(thisMonthStart, -1).slice(0, 7) + '-01';
  const dayOfMonth = parseInt(today.split('-')[2], 10);
  const prevMonthEnd = addDaysStr(prevMonthStart, dayOfMonth - 1);
  const thisMonthRows = rows.filter(r => r.date >= thisMonthStart && r.date <= today);
  const prevMonthRows = rows.filter(r => r.date >= prevMonthStart && r.date <= prevMonthEnd);

  const wowThis = aggregate(thisWeekRows), wowLast = aggregate(lastWeekRows);
  const momThis = aggregate(thisMonthRows), momLast = aggregate(prevMonthRows);
  const hasAny = thisWeekRows.length + lastWeekRows.length + thisMonthRows.length + prevMonthRows.length > 0;

  return (
    <Card eyebrow="Trends" title="Week & month over month" style={{ marginBottom: 16 }}>
      {!hasAny ? <div style={styles.mutedNote}>Not enough recent data to compare yet.</div> : (
        <div style={styles.twoCol} className="two-col">
          <div>
            <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 8 }}>This week vs last week</div>
            <ImpactRow label="Occupancy" a={wowThis.occupancyPct} b={wowLast.occupancyPct} fmt={fmtPct} />
            <ImpactRow label="Revenue" a={wowThis.revenue} b={wowLast.revenue} fmt={fmtMoney} />
          </div>
          <div>
            <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 8 }}>
              This month vs last month <span style={{ fontWeight: 400, color: 'var(--muted)', fontSize: 11 }}>(same day count)</span>
            </div>
            <ImpactRow label="Occupancy" a={momThis.occupancyPct} b={momLast.occupancyPct} fmt={fmtPct} />
            <ImpactRow label="Revenue" a={momThis.revenue} b={momLast.revenue} fmt={fmtMoney} />
          </div>
        </div>
      )}
    </Card>
  );
}

function MarketShareCard({ rows, aggregate }) {
  const [groupBy, setGroupBy] = useState('venueName');
  const groupOptions = [
    { value: 'venueName', label: 'By venue' },
    { value: 'business', label: 'By business' },
    { value: 'city', label: 'By city' },
  ];

  const total = aggregate(rows);
  const groups = groupAndAggregate(rows, r => r[groupBy], aggregate)
    .filter(g => g.availableHours > 0)
    .map(g => {
      const bookingShare = safeDiv(g.occupiedHours, total.occupiedHours) * 100;
      const supplyShare = safeDiv(g.availableHours, total.availableHours) * 100;
      const revenueShare = safeDiv(g.revenue, total.revenue) * 100;
      return {
        ...g, bookingShare, supplyShare, revenueShare,
        performanceIndex: supplyShare > 0 ? bookingShare / supplyShare : null,
      };
    })
    .sort((a, b) => (b.performanceIndex || 0) - (a.performanceIndex || 0));

  return (
    <Card eyebrow="Market share" title="Performance index" style={{ marginBottom: 16 }}>
      <div style={{ marginBottom: 12 }}>
        <Select value={groupBy} onChange={setGroupBy} options={groupOptions} />
      </div>
      {groups.length === 0 ? <div style={styles.mutedNote}>No data for this scope.</div> : (
        <table style={styles.table}>
          <thead><tr>
            <th style={styles.th}>Name</th><th style={styles.th}>Supply share</th>
            <th style={styles.th}>Booking share</th><th style={styles.th}>Revenue share</th>
            <th style={styles.th}>Performance index</th>
          </tr></thead>
          <tbody>
            {groups.map(g => (
              <tr key={g.key}>
                <td style={styles.td}><b>{g.key}</b></td>
                <td style={styles.td}>{fmtPct(g.supplyShare)}</td>
                <td style={styles.td}>{fmtPct(g.bookingShare)}</td>
                <td style={styles.td}>{fmtPct(g.revenueShare)}</td>
                <td style={styles.td}>
                  {g.performanceIndex != null
                    ? <span style={{ fontWeight: 800, color: g.performanceIndex >= 1 ? '#1F6B44' : 'var(--danger)' }}>{g.performanceIndex.toFixed(2)}×</span>
                    : '—'}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
      <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 10 }}>
        Performance index = booking share ÷ supply share. Above 1.0× means it earns more booked hours than its share of available court-hours would predict; below 1.0× means it underperforms its capacity.
      </div>
    </Card>
  );
}

/* =========================================================================
   DATA LOG TAB — track when bookings were last checked/confirmed
========================================================================= */

function DataLogTab({ ctx }) {
  const { master, setMaster, isAdmin } = ctx;
  const logs = master.checkLogs || [];

  const [checkedAt, setCheckedAt] = useState(() => {
    const now = new Date();
    now.setSeconds(0, 0);
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    return now.toISOString().slice(0, 16);
  });
  const [coveredFrom, setCoveredFrom] = useState(todayStr());
  const [coveredTo, setCoveredTo] = useState(todayStr());
  const [notes, setNotes] = useState('');

  function addLog() {
    if (!isAdmin || !coveredFrom || !coveredTo) return;
    const entry = {
      id: uid('log'),
      checkedAt: new Date(checkedAt).toISOString(),
      coveredFrom, coveredTo,
      notes: notes.trim(),
    };
    setMaster({ ...master, checkLogs: [entry, ...logs] });
    setNotes('');
    setCoveredFrom(todayStr());
    setCoveredTo(todayStr());
  }
  function deleteLog(id) {
    if (!isAdmin) return;
    setMaster({ ...master, checkLogs: logs.filter(l => l.id !== id) });
  }

  const sorted = [...logs].sort((a, b) => new Date(b.checkedAt) - new Date(a.checkedAt));
  const latestCoveredTo = logs.length ? logs.reduce((max, l) => l.coveredTo > max ? l.coveredTo : max, logs[0].coveredTo) : null;
  const mostRecentCheck = sorted[0] || null;

  return (
    <TabWrap title="Data Log" eyebrow="Track when bookings were last checked & confirmed">
      <div style={styles.statGrid} className="stat-grid">
        <StatBlock label="Confirmed through" value={latestCoveredTo ? fmtShortDate(latestCoveredTo) : '—'} accent="var(--court)" sub={latestCoveredTo ? `${latestCoveredTo}` : 'No check-ins logged yet'} />
        <StatBlock label="Last check-in" value={mostRecentCheck ? timeAgo(mostRecentCheck.checkedAt) : '—'} sub={mostRecentCheck ? new Date(mostRecentCheck.checkedAt).toLocaleString() : ''} />
        <StatBlock label="Total check-ins logged" value={logs.length} />
      </div>

      {isAdmin && (
        <Card title="Log a check-in" eyebrow="Record what you just verified">
          <div style={styles.formRow} className="form-row">
            <Field label="Checked at"><input type="datetime-local" style={styles.input} value={checkedAt} onChange={e => setCheckedAt(e.target.value)} /></Field>
          </div>
          <div style={styles.formRow} className="form-row">
            <Field label="Covered from"><input type="date" style={styles.input} value={coveredFrom} onChange={e => setCoveredFrom(e.target.value)} /></Field>
            <Field label="Covered to"><input type="date" style={styles.input} value={coveredTo} onChange={e => setCoveredTo(e.target.value)} /></Field>
          </div>
          <Field label="Notes (optional)"><input style={styles.input} value={notes} onChange={e => setNotes(e.target.value)} placeholder="e.g. Checked all 3 venues, caught up on walk-ins" /></Field>
          <button style={styles.primaryBtn} onClick={addLog}><Plus size={14} /> Add check-in</button>
          <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 10 }}>
            "Covered from / to" is the date range of <b>bookings</b> you actually went through — not necessarily today. If you check every day but only catch up on one day's bookings each time, log a single-day range each time.
          </div>
        </Card>
      )}

      <Card title="Check-in history" style={{ marginTop: isAdmin ? 16 : 0 }}>
        {sorted.length === 0 ? <div style={styles.mutedNote}>No check-ins logged yet{isAdmin ? ' — add your first one above.' : '.'}</div> : (
          <table style={styles.table}>
            <thead><tr>
              <th style={styles.th}>Checked at</th><th style={styles.th}>Covered dates</th>
              <th style={styles.th}>Notes</th><th style={styles.th}></th>
            </tr></thead>
            <tbody>
              {sorted.map(l => (
                <tr key={l.id}>
                  <td style={{ ...styles.td, fontFamily: 'var(--font-mono)', fontSize: 12 }}>{new Date(l.checkedAt).toLocaleString()}</td>
                  <td style={{ ...styles.td, fontFamily: 'var(--font-mono)', fontSize: 12 }}>
                    {l.coveredFrom === l.coveredTo ? fmtShortDate(l.coveredFrom) : `${fmtShortDate(l.coveredFrom)} – ${fmtShortDate(l.coveredTo)}`}
                  </td>
                  <td style={styles.td}>{l.notes || '—'}</td>
                  <td style={styles.td}>{isAdmin && <button style={styles.iconBtnSm} onClick={() => deleteLog(l.id)}><Trash2 size={12} /></button>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </Card>
    </TabWrap>
  );
}

function CalendarTab({ ctx }) {
  const { master, setMaster, isAdmin } = ctx;
  const [date, setDate] = useState(todayStr());
  const [type, setType] = useState('poya');
  const [name, setName] = useState('');

  function addSpecialDay() {
    if (!isAdmin || !date) return;
    const specialDays = { ...master.specialDays, [date]: { type, name: name.trim() } };
    setMaster({ ...master, specialDays });
    setName('');
  }
  function removeSpecialDay(d) {
    if (!isAdmin) return;
    const specialDays = { ...master.specialDays };
    delete specialDays[d];
    setMaster({ ...master, specialDays });
  }

  const entries = Object.entries(master.specialDays).sort((a, b) => b[0].localeCompare(a[0]));

  return (
    <TabWrap title="Calendar" eyebrow="Poya days, public holidays & special events">
      {isAdmin && (
        <Card title="Add a special day">
          <div style={styles.formRow} className="form-row">
            <Field label="Date"><input type="date" style={styles.input} value={date} onChange={e => setDate(e.target.value)} /></Field>
            <Field label="Type"><Select value={type} onChange={setType} options={SPECIAL_DAY_TYPES} /></Field>
          </div>
          <Field label="Name (optional)"><input style={styles.input} value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Vesak Poya" /></Field>
          <button style={styles.primaryBtn} onClick={addSpecialDay}><Plus size={14} /> Add to calendar</button>
          <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 10 }}>
            Weekday / weekend is detected automatically from the date. Mark Poya days and public holidays here so occupancy on those dates can be compared against normal days.
          </div>
        </Card>
      )}

      <Card title="Marked days" style={{ marginTop: isAdmin ? 16 : 0 }}>
        {entries.length === 0 ? <div style={styles.mutedNote}>No special days marked yet.</div> : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {entries.map(([d, info]) => (
              <div key={d} style={{ display: 'flex', alignItems: 'center', gap: 10, borderBottom: '1px solid var(--border)', paddingBottom: 8 }}>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, width: 100 }}>{d}</div>
                <div style={{ fontSize: 12, color: 'var(--muted)', width: 90 }}>{DAY_NAMES[dateToDow(d)]}</div>
                <Badge tone={info.type}>{SPECIAL_DAY_TYPES.find(t => t.value === info.type)?.label}</Badge>
                <div style={{ flex: 1, fontSize: 13 }}>{info.name}</div>
                {isAdmin && <button style={styles.iconBtnSm} onClick={() => removeSpecialDay(d)}><Trash2 size={12} /></button>}
              </div>
            ))}
          </div>
        )}
      </Card>
    </TabWrap>
  );
}
